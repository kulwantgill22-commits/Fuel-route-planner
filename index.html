<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fuel Route Planner</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Fuel%20Route%20Planner%22%2C%22short_name%22%3A%22FuelPlanner%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%253E%253Crect%20fill%3D'%230284c7'%20width%3D'100'%20height%3D'100'%20rx%3D'20'%2F%253E%253Ctext%20y%3D'.9em'%20font-size%3D'75'%20x%3D'12'%253E%25F0%259F%259A%259B%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; }
    .header { text-align: center; padding: 10px 0 16px 0; border-bottom: 1px solid #1e293b; margin-bottom: 16px; }
    .header h2 { margin: 0; font-size: 20px; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    h3 { margin-top: 0; font-size: 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    input { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px; border-radius: 8px; font-size: 15px; }
    input:focus { border-color: #38bdf8; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-main { background: #0284c7; color: white; margin-top: 14px; }
    .btn-add { background: #334155; color: #38bdf8; border: 1px dashed #0284c7; margin-top: 10px; padding: 10px; }
    .btn-nav { background: #16a34a; color: white; padding: 8px 12px; font-size: 13px; text-decoration: none; border-radius: 6px; width: auto; display: inline-block; }
    .pump-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .pump-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pump-title { font-weight: bold; color: #e2e8f0; font-size: 14px; }
    .btn-delete { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 0 4px; }
    .skip-box { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: #fbbf24; }
    .skip-box input { width: auto; }
    .stop-card { background: #064e3b; border-left: 5px solid #10b981; border-radius: 8px; padding: 14px; margin-top: 12px; }
    .stop-badge { background: #10b981; color: #022c22; font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 4px; }
    .warning { background: #7f1d1d; border-left: 5px solid #ef4444; border-radius: 8px; padding: 12px; margin-top: 12px; color: #fecaca; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🚛 Smart Fuel Route Planner</h2>
  </div>

  <div class="card">
    <h3>ਟਰੱਕ ਦੀ ਜਾਣਕਾਰੀ</h3>
    <div class="grid-2">
      <div>
        <label>ਕੁੱਲ ਟੈਂਕ (ਗੈਲਨ)</label>
        <input type="number" id="tankCap" value="200">
      </div>
      <div>
        <label>ਮੌਜੂਦਾ ਤੇਲ (ਗੈਲਨ)</label>
        <input type="number" id="startFuel" value="160">
      </div>
      <div>
        <label>ਔਸਤ ਮਾਈਲੇਜ (MPG)</label>
        <input type="number" id="truckMpg" value="6.5" step="0.1">
      </div>
      <div>
        <label>ਰਿਜ਼ਰਵ ਲਿਮਿਟ (ਗੈਲਨ)</label>
        <input type="number" id="reserveFuel" value="40">
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>ਰਿਲੇਅ ਦੇ ਪੰਪ ਅਤੇ ਰੇਟ</h3>
    </div>
    
    <div id="pumpContainer"></div>

    <button class="btn btn-add" onclick="addPump()">+ ਨਵਾਂ ਪੰਪ ਸ਼ਾਮਲ ਕਰੋ</button>
    <button class="btn btn-main" onclick="calculateFuelStops()">ਸਭ ਤੋਂ ਸਸਤਾ ਸਟਾਪ ਕੱਢੋ</button>
  </div>

  <div class="card" id="resultsSection" style="display: none;">
    <h3>ਤੇਲ ਪਵਾਉਣ ਦੀ ਯੋਜਨਾ</h3>
    <div id="stopsOutput"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');


    }

    let defaultPumps = [
      { name: "Pilot #329", loc: "Council Bluffs, IA", miles: 85, price: 3.25, skip: false },
      { name: "Sapp Bros", loc: "Omaha, NE", miles: 480, price: 2.98, skip: false },
      { name: "Love's #730", loc: "Grand Island, NE", miles: 620, price: 3.12, skip: false },
      { name: "Sapp Bros", loc: "Cheyenne, WY", miles: 980, price: 3.05, skip: false }
    ];

    let pumps = JSON.parse(localStorage.getItem('saved_truck_pumps')) || defaultPumps;

    function savePumps() {
      localStorage.setItem('saved_truck_pumps', JSON.stringify(pumps));
    }

    function renderPumps() {
      const container = document.getElementById('pumpContainer');
      container.innerHTML = "";

      pumps.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'pump-card';
        div.innerHTML = `
          <div class="pump-header">
            <span class="pump-title">ਪੰਪ #${idx + 1}</span>
            <button class="btn-delete" onclick="removePump(${idx})">✖</button>
          </div>
          <div class="grid-2">
            <div>
              <label>ਪੰਪ ਦਾ ਨਾਮ</label>
              <input type="text" value="${p.name}" onchange="updatePump(${idx}, 'name', this.value)">
            </div>
            <div>
              <label>ਸ਼ਹਿਰ/ਸੂਬਾ (GPS)</label>
              <input type="text" value="${p.loc}" onchange="updatePump(${idx}, 'loc', this.value)">
            </div>
            <div>
              <label>ਮੀਲ (Distance)</label>
              <input type="number" value="${p.miles}" onchange="updatePump(${idx}, 'miles', parseFloat(this.value))">
            </div>
            <div>
              <label>ਅੱਜ ਦਾ ਰੇਟ ($)</label>
              <input type="number" step="0.01" value="${p.price}" onchange="updatePump(${idx}, 'price', parseFloat(this.value))">
            </div>
          </div>
          <div class="skip-box">
            <input type="checkbox" id="skip_${idx}" ${p.skip ? 'checked' : ''} onchange="updatePump(${idx}, 'skip', this.checked)">
            <label for="skip_${idx}" style="margin: 0; color: #fbbf24; cursor: pointer;">ਇਸ ਪੰਪ ਨੂੰ ਛੱਡੋ (Skip Stop)</label>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addPump() {
      pumps.push({ name: "ਨਵਾਂ ਪੰਪ", loc: "", miles: 0, price: 0.00, skip: false });
      savePumps();
      renderPumps();
    }

    function removePump(idx) {
      pumps.splice(idx, 1);
      savePumps();
      renderPumps();
    }

    function updatePump(idx, field, value) {
      pumps[idx][field] = value;
      savePumps();
    }

    function calculateFuelStops() {
      const tank = parseFloat(document.getElementById('tankCap').value) || 200;
      const startFuel = parseFloat(document.getElementById('startFuel').value) || 160;
      const mpg = parseFloat(document.getElementById('truckMpg').value) || 6.5;
      const reserve = parseFloat(document.getElementById('reserveFuel').value) || 40;

      let validPumps = [...pumps].sort((a, b) => a.miles - b.miles);
      let currentMile = 0;
      let currentFuel = startFuel;
      let stops = [];
      let alertMsg = "";

      for (let i = 0; i < validPumps.length; i++) {
        let p = validPumps[i];
        let legDistance = p.miles - currentMile;
        let fuelNeeded = legDistance / mpg;

        if (currentFuel - fuelNeeded <= reserve) {
          let candidates = validPumps.filter((item, index) => index <= i && item.miles > currentMile && !item.skip);

          if (candidates.length === 0) {
            alertMsg = "⚠️ ਚੇਤਾਵਨੀ: ਡੀਜ਼ਲ ਰਿਜ਼ਰਵ ਹੱਦ ਤੋਂ ਹੇਠਾਂ ਜਾ ਰਿਹਾ ਹੈ! ਕਿਸੇ ਪੰਪ ਤੋਂ Skip ਹਟਾਓ।";
            break;
          }

          candidates.sort((a, b) => a.price - b.price);
          let chosen = candidates[0];

          let distanceToStop = chosen.miles - currentMile;
          let arrivalFuel = currentFuel - (distanceToStop / mpg);

          if (arrivalFuel < 0) {
            alertMsg = "⚠️ ਖ਼ਤਰਾ: ਅਗਲੇ ਪੰਪ ਤੱਕ ਪਹੁੰਚਣ ਤੋਂ ਪਹਿਲਾਂ ਤੇਲ ਮੁੱਕ ਜਾਵੇਗਾ!";
            break;
          }

          let gallonsToFill = Math.round(tank - arrivalFuel);

          stops.push({
            name: chosen.name,
            loc: chosen.loc,
            mile: chosen.miles,
            price: chosen.price,
            gallons: gallonsToFill
          });

          currentMile = chosen.miles;
          currentFuel = tank;
          i = validPumps.findIndex(x => x.name === chosen.name && x.miles === chosen.miles);
        }
      }

      const resBox = document.getElementById('resultsSection');
      const outBox = document.getElementById('stopsOutput');
      resBox.style.display = "block";
      outBox.innerHTML = "";

      if (alertMsg) {
        outBox.innerHTML += `<div class="warning">${alertMsg}</div>`;
      }

      if (stops.length === 0 && !alertMsg) {
        outBox.innerHTML = `<div class="stop-card" style="background: #1e3a8a; border-left-color: #38bdf8;">ਤੁਹਾਡੇ ਮੌਜੂਦਾ ਤੇਲ ਮੁਤਾਬਕ ਟੈਂਕ ਸੁਰੱਖਿਅਤ ਹੈ। ਅਜੇ ਸਟਾਪ ਦੀ ਲੋੜ ਨਹੀਂ।</div>`;
        return;
      }

      stops.forEach((s, i) => {
        let mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name + ' ' + s.loc)}`;
        outBox.innerHTML += `
          <div class="stop-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="stop-badge">ਸਟਾਪ #${i + 1}</span>
              <span style="font-weight: bold; color: #a7f3d0; font-size: 16px;">$${s.price.toFixed(2)}/Gal</span>
            </div>
            <div style="margin: 8px 0; font-size: 15px;">
              <b>${s.name}</b> (${s.loc})
            </div>
            <div style="font-size: 13px; color: #d1fae5; margin-bottom: 10px;">
              📍 ਮੀਲ: <b>${s.mile}</b> | ⛽ ਡੀਜ਼ਲ ਪਵਾਓ: <b>${s.gallons} Gallons</b>
            </div>
            <a href="${mapLink}" target="_blank" class="btn-nav">🗺️ Google Maps 'ਤੇ ਨੈਵੀਗੇਸ਼ਨ ਸ਼ੁਰੂ ਕਰੋ</a>
          </div>
        `;
      });
    }

    renderPumps();
  </script>
</body>
</html>
